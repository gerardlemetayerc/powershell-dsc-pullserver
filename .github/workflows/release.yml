name: Build and Release DSC Admin Console
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      - name: Sync version.json from tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v', 'V')
          $jsonPath = "build/version.json"
          $cfg = Get-Content -Raw -Path $jsonPath | ConvertFrom-Json
          $cfg.version = $tagVersion
          $json = $cfg | ConvertTo-Json -Depth 8
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($jsonPath, $json, $utf8NoBom)
          Write-Host "version.json synced to tag version: $tagVersion"

      - name: Build executable
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Output "DSC-Admin-Console.exe" -CommitOverride "${{ github.sha }}"

      - name: Prepare release folder
        run: |
          mkdir release
          copy DSC-Admin-Console.exe release\
          xcopy db release\db /E /I
          xcopy web release\web /E /I
          xcopy templates release\templates /E /I
          xcopy scripts release\scripts /E /I

      - name: Zip Admin Console
        run: |
          Compress-Archive -Path release/* -DestinationPath DSC-Admin-Console.zip
      - name: Upload release folder artifact
        uses: actions/upload-artifact@v7
        with:
          name: DSC-Admin-Console
          path: DSC-Admin-Console.zip

  zip-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Zip PowerShell module
        run: |
          Compress-Archive -Path powershell\DSCPullServer\* -DestinationPath DSCPullServer.zip

      - name: Upload PowerShell artifact
        uses: actions/upload-artifact@v7
        with:
          name: DSCPullServer
          path: DSCPullServer.zip

  release:
    needs: [build-windows, zip-powershell]
    runs-on: windows-latest
    steps:
      - name: Download Admin Console artifact
        uses: actions/download-artifact@v8
        with:
          name: DSC-Admin-Console
      - name: Download PowerShell artifact
        uses: actions/download-artifact@v8
        with:
          name: DSCPullServer
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            DSC-Admin-Console.zip
            DSCPullServer.zip
