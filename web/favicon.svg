<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>DSC Admin Console</title>
  <desc>Favicon inspired by PowerShell DSC and an admin console.</desc>
  <defs>
