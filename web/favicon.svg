    </linearGradient>
    <linearGradient id="screen" x1="18" y1="14" x2="46" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset="1" stop-color="#9fd0ff"/>
